<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortly — a mini URL shortener</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Shortly</h1>
      <p class="subtitle">Paste a long URL, get a short one back.</p>

      <form id="shorten-form" novalidate>
        <label class="sr-only" for="url-input">Long URL</label>
        <div class="row">
          <input
            id="url-input"
            name="url"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://example.com/a/very/long/path"
          />
          <button id="submit-button" type="submit">Shorten</button>
        </div>
      </form>

      <p id="error" class="error" role="alert" hidden></p>

      <section id="result" class="result" hidden>
        <div class="row">
          <a id="short-link" class="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button id="copy-button" type="button" class="ghost">Copy</button>
        </div>
        <p class="meta">
          <span id="long-url" class="long-url"></span>
        </p>
        <p class="meta">
          <strong id="click-count">0</strong> <span id="click-label">clicks</span>
          <button id="refresh-button" type="button" class="link">Refresh</button>
        </p>
      </section>
    </main>

    <footer>
      <small>WedigTech full stack take-home · Express + MongoDB</small>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
